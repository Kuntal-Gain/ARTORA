name: artora
description: Production-ready Flutter scaffold generated by the wizard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_riverpod: ^3.2.1

  # Backend – Firebase

  # Backend – Supabase
  supabase_flutter: ^2.12.0

  # Backend – Appwrite

  # Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4

  # Icons

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1
  file_picker: ^10.3.10

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  permission_handler: ^12.0.1

  # Device & System
  device_info_plus: ^11.2.0
  app_version_update: ^6.2.0


  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.12.2
  hive_ce_generator: ^1.11.1

dependency_overrides:
  # Riverpod 3.x requires a newer test_api than what Flutter SDK pins.
  # This override allows resolution while remaining compatible with flutter_test.
  test_api: 0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/
    - .env

  fonts:
    - family: "Sora"
      fonts:
        - asset: "assets/fonts/Sora-Bold.ttf"
        - asset: "assets/fonts/Sora-ExtraBold.ttf"
        - asset: "assets/fonts/Sora-ExtraLight.ttf"
        - asset: "assets/fonts/Sora-Light.ttf"
        - asset: "assets/fonts/Sora-Medium.ttf"
        - asset: "assets/fonts/Sora-Regular.ttf"
        - asset: "assets/fonts/Sora-SemiBold.ttf"
        - asset: "assets/fonts/Sora-Thin.ttf"
    - family: "PlayfairDisplay"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-Black.ttf"
        - asset: "assets/fonts/PlayfairDisplay-Bold.ttf"
        - asset: "assets/fonts/PlayfairDisplay-ExtraBold.ttf"
        - asset: "assets/fonts/PlayfairDisplay-Italic.ttf"
        - asset: "assets/fonts/PlayfairDisplay-Medium.ttf"
        - asset: "assets/fonts/PlayfairDisplay-Regular.ttf"
        - asset: "assets/fonts/PlayfairDisplay-SemiBold.ttf"
    - family: "PlayfairDisplay BlackItalic"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-BlackItalic.ttf"
    - family: "PlayfairDisplay BoldItalic"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-BoldItalic.ttf"
    - family: "PlayfairDisplay ExtraBoldItalic"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-ExtraBoldItalic.ttf"
    - family: "PlayfairDisplay MediumItalic"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-MediumItalic.ttf"
    - family: "PlayfairDisplay SemiBoldItalic"
      fonts:
        - asset: "assets/fonts/PlayfairDisplay-SemiBoldItalic.ttf"
